name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check python/srslte_sniffer
      - name: Test
        run: pytest -q

  c-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (stub mode — no srsRAN)
        run: cmake --build build -j
      - name: Run smoke tests
        run: ctest --test-dir build --output-on-failure

  end-to-end:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Decode the demo capture end-to-end
        run: |
          srslte-sniffer analyze \
              "Output Files/imsi.pcap" \
              --db /tmp/captures.db
          srslte-sniffer track --db /tmp/captures.db | head -50
          srslte-sniffer detect --db /tmp/captures.db | head -50
      - name: Decoder benchmark (regression watch)
        run: python3 tools/benchmark.py --limit 5000
      - name: Streaming pipeline smoke
        run: |
          srslte-sniffer simulate imsi_pcap_demo.txt /tmp/sim.journal --rate 0 --limit 500
          test -s /tmp/sim.journal
      - name: Redactor round-trip
        run: |
          srslte-sniffer redact "Output Files/imsi.pcap" /tmp/red.pcapng
          srslte-sniffer analyze /tmp/red.pcapng --db /tmp/red.db

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build python image
        run: docker buildx build --target python -t srslte-sniffer:python --load .
      - name: Smoke test image
        run: docker run --rm srslte-sniffer:python srslte-sniffer --help
