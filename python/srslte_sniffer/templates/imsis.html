<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMSI leaderboard — srsLTE-Sniffer</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 1100px; margin: 2em auto; padding: 0 1em; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { padding: 4px 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #f6f6f6; }
</style>
</head>
<body>
  <h1>IMSI leaderboard</h1>
  <p><a href="/">← Overview</a></p>
  <table>
    <thead><tr><th>IMSI (or hash)</th><th>Count</th><th>First seen</th><th>Last seen</th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ r.imsi }}</td>
        <td>{{ r.n }}</td>
        <td>{{ r.first_str }}</td>
        <td>{{ r.last_str }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
