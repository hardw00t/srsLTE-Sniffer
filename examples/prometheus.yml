# Example Prometheus scrape config for srsLTE-Sniffer.
# Drop into your existing prometheus.yml under `scrape_configs:`.

scrape_configs:
  - job_name: srslte-sniffer
    scrape_interval: 10s
    static_configs:
      - targets: ["sniffer:9100"]
        labels:
          environment: lab
          tenant: default
